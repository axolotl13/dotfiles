kitty_mod               ctrl+shift
clear_all_shortcuts     yes

# Clipboard
map     kitty_mod+c             copy_to_clipboard
map     kitty_mod+v             paste_from_clipboard

# Scrolling
map     kitty_mod+u             scroll_line_up
map     kitty_mod+page_up       scroll_page_up
map     kitty_mod+d             scroll_line_down
map     kitty_mod+page_down     scroll_page_down
map     kitty_mod+home          scroll_home
map     kitty_mod+end           scroll_end
map     kitty_mod+h             show_scrollback
map     kitty_mod+g             show_last_command_output
map     kitty_mod+z             scroll_to_prompt -1
map     kitty_mod+x             scroll_to_prompt 1

# Window management
map     kitty_mod+enter         launch --cwd=current
map     kitty_mod+n             new_os_window
map     kitty_mod+w             close_window
map     kitty_mod+1             next_window
map     kitty_mod+3             previous_window
map     kitty_mod+2             move_window_backward
map     kitty_mod+4             move_window_forward
map     kitty_mod+a             launch --allow-remote-control kitty +kitten broadcast
map     kitty_mod+f             kitten hints --type path

# Tab management
map     ctrl+f1                 next_tab
map     ctrl+f2                 previous_tab
map     kitty_mod+t             new_tab
map     kitty_mod+q             close_tab

# Layout management
map     kitty_mod+l             next_layout

# Font sizes
map     kitty_mod+,             change_font_size all +1.0
map     kitty_mod+.             change_font_size all -1.0
map     kitty_mod+space         change_font_size all 0

# Miscellaneous
map     kitty_mod+f2            edit_config_file
map     kitty_mod+f3            detach_window new-tab
map     kitty_mod+f12           goto_layout stack
map     kitty_mod+f11           toggle_fullscreen
map     kitty_mod++             kitten unicode_input


# Windows
map     kitty_mod+right         resize_window narrower
map     kitty_mod+left          resize_window wider
map     kitty_mod+up            resize_window taller
map     kitty_mod+down          resize_window shorter 3

map     kitty_mod+r             load_config_file

# Sessions
map f7>f goto_session ~/.config/kitty/sessions/launch-fish.kitty-session
map f7>n goto_session ~/.config/kitty/sessions/launch-nvim.kitty-session
map f7>h goto_session ~/.config/kitty/sessions/launch-human-odoo.kitty-session
map f7>o goto_session ~/.config/kitty/sessions/launch-odoo-odoo.kitty-session
# map f7>/ goto_session --sort-by=alphabetical
# map f7>- goto_session -1

# Experimental
action_alias launcher launch --cwd=current --type=overlay
mouse_map right press ungrabbed mouse_select_command_output
